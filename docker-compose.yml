# CyberFusion X — single-service demo deployment.
# Persistence is the file-backed store under ./data (cases + evidence vault).
# PostgreSQL/MinIO were removed: they were provisioned but never used by the
# code. V1-V3 SQL under backend/src/main/resources/db/migration documents the
# optional Phase-2 relational move.
services:
  cyberfusion-x:
    build: .
    container_name: cyberfusion-x
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DATA_DIR: "/app/data"
      # Set DEMO_MODE=false to disable the badged 1-click demo officer logins.
      DEMO_MODE: "true"
      JWT_SECRET: "change-me-in-any-real-deployment"
    volumes:
      - app_data:/app/data

volumes:
  app_data:
